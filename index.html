                        <a href="notes.html" target="iframe1" class="header_btn" id="music_btn">music</a>

                            <div class="drop_menu" id="downloads_menu">
                                <nav>

                                    <button>music</button>

                            </div>
                        </a>
                    </nav>
                </div>

            </header>

            <div class="content-window">
                <div>

    <style>
        @font-face {
            font-family: "terminal";
            src: url(fonts/modern_dos/ModernDOS8x14.ttf);
        }

        iframe{
            height: 100vh;
        }
        .header {
            position: relative;
            display: grid;
            grid-template-columns: auto auto;
            border-width: 2px;
            border-style: solid;
            border-color: white;
        }
        #header_row {
            position: absolute;
            right: 0;
            bottom: 0%;
            font-size: 0;
        }
        .header_btn, button {
            user-select: none;
            cursor: pointer;
            background-color: transparent;
            color: white;
            border: none;
            font-family: 'terminal';
            font-size: large;
            padding-left: 10px; padding-right: 10px;
            padding-bottom: none;

        }
        .header_btn:hover, button:hover{
            color: red;
            text-shadow: 0 0 10px red;
            text-decoration: underline;
        }
        .drop_menu {
            z-index: 2;
            background-color: white;
            position: absolute;
            display: none;
            top: 100%;
            left: 0;
        }
        .drop_menu button {
            color: black;
            width: 100%;
        }
        .drop_menu button:hover {
            color: white;
            background-color: red;
        }
        #downloads_btn {
            position: relative;
        }
        #downloads_btn:hover .drop_menu {
            display: block;
        }

        
    </style>
